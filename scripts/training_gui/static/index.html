<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encoder training console</title>
<!-- Inline icon: the browser asks for /favicon.ico otherwise, and a 404 in the
     console of a page whose job is showing errors is a distraction. The script
     swaps the href between four inline dots, so the tab reports the run's state
     without a file to serve. -->
<link id="favicon" rel="icon" href="data:,">
<style>
  /* Layout: an app shell rather than a scrolling document. The header is fixed,
     the catalogue scrolls in the left column and the log holds the right one at
     full height, so starting a run never scrolls its output off the screen.
     Below 1000px the two columns stack and the page scrolls normally. */
  :root {
    color-scheme: light dark;
    --ink: #16202c;
    --muted: #5f6b7a;
    --faint: #8a94a6;
    --line: #dde3ea;
    --panel: #ffffff;
    --page: #eef1f5;
    --raised: #f7f9fb;
    --accent: #1f4fd8;
    --good: #0f7b3f;
    --bad: #a3160b;
    --neutral: #46536a;
    --term-bg: #10151c;
    --term-ink: #d7dee7;
    /* Text on a filled button. The dark palette lightens the accent and the red
       so they read against a dark panel, which then needs dark text on top. */
    --on-fill: #ffffff;
    --radius: 10px;
    --header: 64px;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e7ecf3;
      --muted: #9aa6b6;
      --faint: #78849a;
      --line: #2a3340;
      --panel: #171d26;
      --page: #0e1319;
      --raised: #1e2530;
      --accent: #7fa3ff;
      --good: #4ec97f;
      --bad: #ff8a80;
      --neutral: #a5b1c4;
      --term-bg: #0a0e13;
      --term-ink: #cfd8e3;
      --on-fill: #0e1319;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* -- header ------------------------------------------------------------- */
  header {
    flex: 0 0 auto;
    height: var(--header);
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 0 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
  h1 { font-size: 17px; font-weight: 650; margin: 0; letter-spacing: -.01em; white-space: nowrap; }
  .sub { color: var(--faint); margin: 0; font-size: 13px; white-space: nowrap;
         overflow: hidden; text-overflow: ellipsis; }
  .statusline { display: flex; align-items: center; gap: 12px; margin-left: auto; }
  .verdict {
    font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    padding: 4px 10px; border-radius: 999px; border: 1px solid currentColor;
    white-space: nowrap;
  }
  .verdict.succeeded { color: var(--good); }
  .verdict.failed { color: var(--bad); }
  .verdict.stopped, .verdict.interrupted { color: var(--neutral); }
  .verdict.idle { color: var(--faint); }
  .verdict.running { color: var(--accent); }
  .verdict.running::before {
    content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 7px;
    border-radius: 50%; background: currentColor; vertical-align: middle;
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  .step { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .elapsed { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }

  /* -- the two columns ---------------------------------------------------- */
  main {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(400px, 1fr) minmax(460px, 1.1fr);
    gap: 16px;
    padding: 16px;
  }
  main.focus-log { grid-template-columns: 1fr; }
  main.focus-log .column-left { display: none; }
  .column { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 16px; }
  .column-left { overflow-y: auto; padding-right: 2px; }
  .column-right { overflow: hidden; }

  section {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px;
  }
  section.fill { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  h2 {
    font-size: 11px; margin: 0 0 12px; text-transform: uppercase; letter-spacing: .1em;
    color: var(--faint); font-weight: 700;
  }

  /* -- the catalogue ------------------------------------------------------ */
  .run {
    border: 1px solid var(--line); border-radius: 8px; background: var(--raised);
    padding: 12px 14px; margin-bottom: 10px;
  }
  .run:last-child { margin-bottom: 0; }
  .run-head { display: flex; gap: 14px; align-items: center; justify-content: space-between; }
  .run-name { font-weight: 620; }
  /* Descriptions run to a paragraph. Three lines is enough to tell the entries
     apart; a click gives the rest, so the column stays a list of runs. */
  .run-desc { color: var(--muted); margin: 6px 0 0; font-size: 13.5px; cursor: pointer; }
  .run-desc.clamped {
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .params { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; }
  .param { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
  select, button { font: inherit; }
  select {
    padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--panel); color: var(--ink); font-size: 13px;
  }
  button {
    padding: 5px 12px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--panel); color: var(--ink); cursor: pointer; font-size: 13px;
  }
  button:hover:not(:disabled) { border-color: var(--faint); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary { background: var(--accent); color: var(--on-fill); border-color: transparent; }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); }
  button.stop { background: var(--bad); border-color: transparent; color: var(--on-fill); }
  pre, code, .mono { font-family: var(--mono); font-size: 12.5px; }
  details.commands { margin-top: 10px; }
  details.commands > summary {
    cursor: pointer; color: var(--faint); font-size: 12px; list-style: none;
  }
  details.commands > summary::-webkit-details-marker { display: none; }
  details.commands > summary::before { content: "\25b8  "; }
  details.commands[open] > summary::before { content: "\25be  "; }
  details.commands ul { margin: 8px 0 0; padding: 0; list-style: none; }
  details.commands li {
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 8px; margin-bottom: 4px; overflow-x: auto; white-space: pre;
    color: var(--muted);
  }

  /* -- the step checklist ------------------------------------------------- */
  .steps { margin: 0 0 10px; padding: 0; list-style: none; font-size: 13.5px; }
  .steps li { display: flex; gap: 10px; align-items: baseline; padding: 2px 0; }
  .steps .glyph { width: 1.2em; text-align: center; }
  .steps .label { flex: 1; min-width: 0; }
  .steps .dur { color: var(--muted); font-variant-numeric: tabular-nums; }
  .steps .running { font-weight: 650; }
  .steps .succeeded .glyph { color: var(--good); }
  .steps .failed .glyph, .steps .interrupted .glyph { color: var(--bad); }
  .steps .pending, .steps .skipped, .steps .stopped { color: var(--muted); }
  .steps details { width: 100%; }
  .steps details summary { cursor: pointer; color: var(--muted); }
  .steps details ul { margin: 4px 0 0; padding: 0 0 0 18px; list-style: none; }
  /* The running step's whole command line, kept to one row: it is a 300-character
     reference, not something to read here, so it truncates and carries the full
     text as a tooltip. The checklist above it says what the step is. */
  #command {
    flex: 0 0 auto; color: var(--faint); margin-bottom: 10px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* The checklist keeps its height and scrolls within it; the log takes whatever
     is left. The other way round, a long checklist squeezes the running row to
     half a line -- and the running row is the one being read. */
  .steps { flex: 0 0 auto; max-height: 230px; overflow-y: auto; }

  /* -- the log ------------------------------------------------------------ */
  .log-controls { margin: 0 0 10px; }
  #log {
    flex: 1 1 0; min-height: 120px; overflow: auto;
    background: var(--term-bg); color: var(--term-ink);
    border-radius: 8px; padding: 12px; margin: 0;
    white-space: pre-wrap; word-break: break-word; line-height: 1.45;
  }

  /* -- files and git ------------------------------------------------------ */
  .files { margin: 0; padding: 0; list-style: none; }
  .files li { padding: 3px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .files li:last-child { border-bottom: none; }
  .files .flag { display: inline-block; width: 3.5em; color: var(--faint); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .branch { font-size: 15px; font-weight: 650; word-break: break-all; margin-top: 10px; }
  .message { margin: 8px 0 0; font-size: 13.5px; }
  .message.bad { color: var(--bad); }
  .message.good { color: var(--good); }
  .raw {
    background: var(--term-bg); color: var(--term-ink); border-radius: 8px; padding: 10px;
    overflow-x: auto; white-space: pre-wrap; margin: 8px 0 0;
  }
  .empty { color: var(--faint); font-size: 13.5px; }
  a { color: var(--accent); }

  /* Too narrow for two columns: back to an ordinary scrolling document, with the
     header stuck to the top so the verdict stays visible. The app-shell rules
     have to be undone rather than just re-stacked -- a viewport-height grid on a
     page that now scrolls overlaps its own rows. */
  @media (max-width: 1000px) {
    body { height: auto; display: block; overflow: auto; }
    header { position: sticky; top: 0; z-index: 5; }
    main { display: block; min-height: 0; padding: 16px; }
    .column { display: block; overflow: visible; }
    .column > section { margin-bottom: 16px; }
    section.fill { display: block; }
    .steps { max-height: none; }
    #log { height: 60vh; flex: none; }
    .sub { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Encoder training console</h1>
    <p class="sub">Runs what the catalogue allows, on this machine, and shows what it wrote.</p>
  </div>
  <div class="statusline">
    <span id="step" class="step"></span>
    <span id="elapsed" class="elapsed"></span>
    <span id="verdict" class="verdict idle">Idle</span>
    <button id="stop" class="stop" hidden>Stop</button>
  </div>
</header>

<main id="layout">
  <div class="column column-left">
    <section id="runs-section">
      <h2>Runs</h2>
      <div id="runs" class="empty">Loading the catalogue&hellip;</div>
    </section>

    <section>
      <h2>Changed files under reports/ and models/</h2>
      <div class="row">
        <button id="refresh-changes">Refresh</button>
      </div>
      <ul id="changes" class="files"></ul>
      <p id="changes-empty" class="empty">Nothing changed yet.</p>
    </section>

    <section>
      <h2>Git</h2>
      <div class="row">
        <button id="save" class="primary">Save this run to a branch</button>
        <button id="update">Update from GitHub</button>
      </div>
      <div id="git-result"></div>
    </section>
  </div>

  <div class="column column-right">
    <section class="fill">
      <h2>Live log</h2>
      <ul id="steps" class="steps"></ul>
      <div id="command" class="mono"></div>
      <div class="row log-controls">
        <button id="copy-log">Copy log</button>
        <button id="copy-failed" hidden>Copy the failing step&rsquo;s output</button>
        <button id="expand-log">Full width</button>
      </div>
      <pre id="log"></pre>
    </section>
  </div>
</main>

<script>
"use strict";

// All state comes from /api/status and /api/log. The page holds nothing across a
// reload but the log offset, which it re-derives from zero -- so reloading while
// a run is going reattaches to it rather than losing it.
let catalogue = [];
let logOffset = 0;
let logRunId = null;
let lastStatus = null;
let busy = false;

const $ = (id) => document.getElementById(id);
const logBox = $("log");

// Display only, never parsed back. Mirrors shlex.quote closely enough that the
// line on the page is the line a human would type.
const SAFE = /^[A-Za-z0-9_@%+=:,.\/-]+$/;
function quote(word) {
  return SAFE.test(word) ? word : "'" + word.replace(/'/g, "'\\''") + "'";
}

function substitute(element, values) {
  return element.replace(/\{([a-z][a-z0-9_]*)\}/g, (whole, name) =>
    Object.prototype.hasOwnProperty.call(values, name) ? values[name] : whole);
}

function selectedValues(entry) {
  const values = {};
  for (const parameter of entry.parameters) {
    const field = $(`param-${entry.id}-${parameter.name}`);
    values[parameter.name] = field ? field.value : parameter.default;
  }
  return values;
}

function renderCommands(entry) {
  const values = selectedValues(entry);
  const list = $(`commands-${entry.id}`);
  list.innerHTML = "";
  for (const step of entry.steps) {
    const item = document.createElement("li");
    item.textContent = "python -u " + step.map((e) => quote(substitute(e, values))).join(" ");
    list.appendChild(item);
  }
}

// The dropdowns are remembered per entry and parameter. localStorage throws in
// a private window and on a browser configured to block site data; forgetting a
// dropdown is a much better outcome than failing to render the catalogue.
function rememberedChoice(entryId, parameterName) {
  try {
    return localStorage.getItem(`traingui:${entryId}:${parameterName}`);
  } catch (error) {
    return null;
  }
}

function rememberChoice(entryId, parameterName, value) {
  try {
    localStorage.setItem(`traingui:${entryId}:${parameterName}`, value);
  } catch (error) {
    /* not worth reporting */
  }
}

function renderCatalogue() {
  const container = $("runs");
  container.className = "";
  container.innerHTML = "";
  for (const entry of catalogue) {
    const row = document.createElement("div");
    row.className = "run";

    const head = document.createElement("div");
    head.className = "run-head";
    const name = document.createElement("div");
    name.className = "run-name";
    name.textContent = entry.name;
    const button = document.createElement("button");
    button.className = "primary run-button";
    button.textContent = "Run";
    button.onclick = () => startRun(entry);
    head.append(name, button);

    const description = document.createElement("p");
    description.className = "run-desc clamped";
    description.textContent = entry.description;
    description.title = "Click to show the whole description";
    description.onclick = () => description.classList.toggle("clamped");

    const params = document.createElement("div");
    params.className = "params";
    for (const parameter of entry.parameters) {
      const wrap = document.createElement("label");
      wrap.className = "param";
      wrap.textContent = parameter.label;
      const select = document.createElement("select");
      select.id = `param-${entry.id}-${parameter.name}`;
      for (const choice of parameter.choices) {
        const option = document.createElement("option");
        option.value = choice;
        option.textContent = choice;
        option.selected = choice === parameter.default;
        select.appendChild(option);
      }
      const stored = rememberedChoice(entry.id, parameter.name);
      // An unknown stored value falls back to the committed default, so editing
      // the catalogue cannot resurrect a choice that no longer exists.
      if (parameter.choices.includes(stored)) select.value = stored;
      select.onchange = () => {
        rememberChoice(entry.id, parameter.name, select.value);
        renderCommands(entry);
      };
      wrap.appendChild(select);
      params.appendChild(wrap);
    }

    // The command lines are what the run will actually execute and are worth
    // reading before pressing Run, but a 29-step entry printing 29 of them
    // buries the other entries -- so they sit behind a disclosure, shut.
    const commands = document.createElement("details");
    commands.className = "commands";
    const summary = document.createElement("summary");
    const plural = entry.steps.length === 1 ? "command" : "commands";
    summary.textContent = `${entry.steps.length} ${plural}`;
    const list = document.createElement("ul");
    list.id = `commands-${entry.id}`;
    commands.append(summary, list);

    row.append(head, description);
    if (entry.parameters.length) row.append(params);
    row.append(commands);
    container.appendChild(row);
    renderCommands(entry);
  }
  applyBusy();
}

function applyBusy() {
  for (const button of document.querySelectorAll(".run-button")) button.disabled = busy;
  $("save").disabled = busy;
  $("update").disabled = busy;
  $("stop").hidden = !busy;
}

async function api(path, options) {
  const response = await fetch(path, options);
  let body = null;
  try { body = await response.json(); } catch (error) { body = null; }
  if (!response.ok) {
    const detail = body && body.detail ? body.detail : `${response.status} ${response.statusText}`;
    throw new Error(detail);
  }
  return body;
}

async function startRun(entry) {
  const body = { id: entry.id, parameters: selectedValues(entry) };
  try {
    // A fresh run means a fresh log; the offset resets before the first poll so
    // nothing of the previous run is left on screen.
    logOffset = 0;
    logRunId = null;
    logBox.textContent = "";
    $("git-result").innerHTML = "";
    await api("/api/run", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
  } catch (error) {
    alert("Could not start the run: " + error.message);
  }
  await poll();
}

async function stopRun() {
  // The only guarded button on the page. It is guarded because it is the only
  // one that throws away work that cannot be got back without spending the hours
  // again; Run is deliberately left unguarded, because a confirm on the press
  // made most often is a confirm that gets clicked through.
  const name = (lastStatus && lastStatus.entry_name) || "this run";
  const elapsed = totalElapsed(lastStatus);
  const since = elapsed ? ` It has been going for ${elapsed}.` : "";
  if (!confirm(`Stop ${name}?${since} What it has not written yet is lost.`)) return;
  try {
    await api("/api/stop", { method: "POST" });
  } catch (error) {
    alert("Could not stop the run: " + error.message);
  }
}

const VERDICTS = {
  idle: "Idle",
  running: "Running",
  succeeded: "Succeeded",
  failed: "Failed",
  stopped: "Stopped",
  interrupted: "Interrupted",
};

const GLYPHS = {
  succeeded: "✓",
  failed: "✗",
  interrupted: "✗",
  stopped: "■",
  skipped: "–",
  running: "▶",
  pending: "·",
};

// Four dots, inline, so the tab reports the state from across a desk. Kept as
// data URIs for the same reason the empty icon was: no file for the server to
// serve and no 404 in a console whose job is showing errors.
const DOT = (fill) =>
  "data:image/svg+xml," +
  encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">' +
    `<circle cx="8" cy="8" r="7" fill="${fill}"/></svg>`);
const FAVICONS = {
  idle: DOT("#8a94a6"),
  running: DOT("#1f4fd8"),
  succeeded: DOT("#0f7b3f"),
  failed: DOT("#a3160b"),
};

// -- timestamps --------------------------------------------------------------
// The manifest carries ISO 8601 with an offset, so Date.parse is enough. A step
// that is still going has ended_at: null, which is why each of these takes "now"
// rather than reading the clock itself: one poll, one clock read, so the rows on
// screen agree with each other.

function parseTime(value) {
  if (!value) return null;
  const parsed = Date.parse(value);
  return Number.isNaN(parsed) ? null : parsed;
}

function duration(started, ended, now) {
  const from = parseTime(started);
  if (from === null) return "";
  const to = ended ? parseTime(ended) : now;
  if (to === null || to < from) return "";
  return formatDuration(Math.round((to - from) / 1000));
}

function formatDuration(seconds) {
  const hours = Math.floor(seconds / 3600);
  const minutes = Math.floor((seconds % 3600) / 60);
  const rest = seconds % 60;
  const pad = (n) => String(n).padStart(2, "0");
  if (hours) return `${hours}h ${pad(minutes)}m`;
  if (minutes) return `${minutes}m ${pad(rest)}s`;
  return `${pad(rest)}s`;
}

function totalElapsed(status, now) {
  if (!status || !status.started_at) return "";
  return duration(status.started_at, status.ended_at, now === undefined ? Date.now() : now);
}

function stepLabel(status, step) {
  const labels = status.step_labels || [];
  return labels[step.index - 1] || `step ${step.index}`;
}

// -- the step checklist ------------------------------------------------------

function stepRow(status, step, now) {
  const row = document.createElement("li");
  row.className = step.status || "pending";
  const glyph = document.createElement("span");
  glyph.className = "glyph";
  glyph.textContent = GLYPHS[step.status] || GLYPHS.pending;
  const label = document.createElement("span");
  label.className = "label";
  label.textContent = stepLabel(status, step);
  const dur = document.createElement("span");
  dur.className = "dur";
  dur.textContent = step.status === "pending" ? "" : duration(step.started_at, step.ended_at, now);
  row.append(glyph, label, dur);
  return row;
}

// The checklist is rebuilt from scratch on every poll, which would slam a
// disclosure shut a second after it was opened. The open state therefore lives
// here rather than in the DOM.
const disclosureOpen = { succeeded: false, skipped: false };

function collapsedRow(key, status, steps, now, summary) {
  const row = document.createElement("li");
  const details = document.createElement("details");
  details.open = disclosureOpen[key];
  details.ontoggle = () => { disclosureOpen[key] = details.open; };
  const head = document.createElement("summary");
  head.textContent = summary;
  const list = document.createElement("ul");
  for (const step of steps) list.appendChild(stepRow(status, step, now));
  details.append(head, list);
  row.appendChild(details);
  return row;
}

// How many not-yet-started steps to show below the running one: enough to see
// what is coming next, not so many that a 29-step sweep fills the page.
const PENDING_SHOWN = 3;

function renderSteps(status, now) {
  const container = $("steps");
  container.innerHTML = "";
  const steps = Array.isArray(status.steps) ? status.steps : [];
  if (!steps.length) return;

  const succeeded = steps.filter((step) => step.status === "succeeded");
  const skipped = steps.filter((step) => step.status === "skipped");
  const shown = steps.filter(
    (step) => !["succeeded", "skipped", "pending"].includes(step.status));
  const pending = steps.filter((step) => step.status === "pending");

  if (succeeded.length) {
    const total = succeeded.reduce((sum, step) => {
      const from = parseTime(step.started_at);
      const to = parseTime(step.ended_at);
      return from !== null && to !== null ? sum + (to - from) : sum;
    }, 0);
    const plural = succeeded.length === 1 ? "step" : "steps";
    container.appendChild(collapsedRow("succeeded", status, succeeded, now,
      `✓ ${succeeded.length} ${plural} succeeded · ` +
      formatDuration(Math.round(total / 1000))));
  }
  for (const step of shown) container.appendChild(stepRow(status, step, now));
  for (const step of pending.slice(0, PENDING_SHOWN)) {
    container.appendChild(stepRow(status, step, now));
  }
  if (pending.length > PENDING_SHOWN) {
    const rest = document.createElement("li");
    rest.className = "pending";
    rest.textContent = `· ${pending.length - PENDING_SHOWN} more to come`;
    container.appendChild(rest);
  }
  if (skipped.length) {
    const plural = skipped.length === 1 ? "step" : "steps";
    container.appendChild(collapsedRow("skipped", status, skipped, now,
      `– ${skipped.length} ${plural} never ran`));
  }
}

function renderTab(status) {
  const state = status.status || "idle";
  const name = status.entry_name || "";
  if (state === "running") {
    const counter = status.step_index && status.step_count
      ? `${status.step_index}/${status.step_count} · ` : "";
    document.title = `▶ ${counter}${name}`.trim();
    $("favicon").href = FAVICONS.running;
  } else if (state === "succeeded") {
    document.title = `✅ Succeeded · ${name}`.trim();
    $("favicon").href = FAVICONS.succeeded;
  } else if (["failed", "stopped", "interrupted"].includes(state)) {
    document.title = `❌ ${VERDICTS[state]} · ${name}`.trim();
    $("favicon").href = FAVICONS.failed;
  } else {
    document.title = "Encoder training console";
    $("favicon").href = FAVICONS.idle;
  }
}

function renderStatus(status) {
  // One clock read for the whole render, so the total and the running step's own
  // elapsed cannot disagree by a second.
  const now = Date.now();
  const state = status.status || "idle";
  const verdict = $("verdict");
  verdict.className = "verdict " + state;
  verdict.textContent = VERDICTS[state] || state;

  const stepLine = [];
  if (status.entry_name) stepLine.push(status.entry_name);
  if (status.step_index && status.step_count) {
    stepLine.push(`step ${status.step_index} of ${status.step_count}`);
  }
  $("step").textContent = stepLine.join(" — ");
  $("elapsed").textContent = totalElapsed(status, now);
  $("command").textContent = status.command || "";
  $("command").title = status.command || "";
  renderSteps(status, now);
  renderTab(status);
  $("copy-failed").hidden = !failingStep(status);

  const wasBusy = busy;
  busy = state === "running";
  applyBusy();
  // The run just ended: the file list is the first thing wanted next.
  if (wasBusy && !busy) refreshChanges();
}

// -- copying -----------------------------------------------------------------

function failingStep(status) {
  const steps = (status && status.steps) || [];
  return steps.find((step) => step.status === "failed") || null;
}

function failingStepOutput() {
  const step = failingStep(lastStatus);
  if (!step) return null;
  // The runner banners each step as "=== step N/M: <command> ===", so the slice
  // from one banner to the next is that step's own output.
  const text = logBox.textContent;
  const start = text.indexOf(`=== step ${step.index}/`);
  if (start < 0) return null;
  const rest = text.slice(start);
  const next = rest.indexOf("\n=== ", 1);
  return next < 0 ? rest : rest.slice(0, next);
}

async function copyToClipboard(text, button) {
  const previous = button.textContent;
  try {
    await navigator.clipboard.writeText(text);
    button.textContent = "Copied";
  } catch (error) {
    button.textContent = "Could not copy";
  }
  setTimeout(() => { button.textContent = previous; }, 1500);
}

async function poll() {
  let status;
  try {
    status = await api("/api/status");
  } catch (error) {
    return;
  }
  lastStatus = status;
  renderStatus(status);

  try {
    // A different run id means a different log file; start reading it from zero.
    if (status.run_id && status.run_id !== logRunId) {
      logRunId = status.run_id;
      logOffset = 0;
      logBox.textContent = "";
    }
    const chunk = await api(`/api/log?offset=${logOffset}`);
    if (chunk.run_id !== logRunId) return;
    if (chunk.text) {
      // Follow the tail unless the reader has scrolled up to look at something.
      const following = logBox.scrollHeight - logBox.scrollTop - logBox.clientHeight < 40;
      logBox.textContent += chunk.text;
      if (following) logBox.scrollTop = logBox.scrollHeight;
    }
    logOffset = chunk.next_offset;
  } catch (error) {
    /* a poll that fails is retried a second later; nothing to say about it */
  }
}

async function refreshChanges() {
  const list = $("changes");
  const empty = $("changes-empty");
  try {
    const body = await api("/api/changes");
    list.innerHTML = "";
    for (const item of body.changed) {
      const line = document.createElement("li");
      const flag = document.createElement("span");
      flag.className = "flag mono";
      flag.textContent = item.untracked ? "new" : item.status;
      const path = document.createElement("span");
      path.className = "mono";
      path.textContent = item.path;
      line.append(flag, path);
      list.appendChild(line);
    }
    empty.textContent = body.changed.length ? "" : "Nothing changed yet.";
    empty.hidden = body.changed.length > 0;
  } catch (error) {
    list.innerHTML = "";
    empty.hidden = false;
    empty.textContent = "Could not read the working tree: " + error.message;
  }
}

function renderGitResult(result) {
  const box = $("git-result");
  box.innerHTML = "";

  if (result.ok && result.branch) {
    const branch = document.createElement("div");
    branch.className = "branch mono";
    branch.textContent = result.branch;
    box.appendChild(branch);
    if (result.compare_url) {
      const link = document.createElement("p");
      const anchor = document.createElement("a");
      anchor.href = result.compare_url;
      anchor.target = "_blank";
      anchor.rel = "noopener";
      anchor.textContent = "Open the compare view on GitHub";
      link.appendChild(anchor);
      box.appendChild(link);
    }
  }

  const message = document.createElement("p");
  message.className = "message " + (result.ok ? "good" : "bad");
  message.textContent = result.message;
  box.appendChild(message);

  if (result.blocking_paths && result.blocking_paths.length) {
    const list = document.createElement("ul");
    list.className = "files";
    for (const path of result.blocking_paths) {
      const line = document.createElement("li");
      line.className = "mono";
      line.textContent = path;
      list.appendChild(line);
    }
    box.appendChild(list);
  }

  // On failure, the raw output of the step that stopped the sequence, with no
  // interpretation and no offer to retry differently. The honest next move at
  // that point is to bring the error to a chat.
  if (!result.ok) {
    const failed = (result.steps || []).filter((step) => step.exit_code !== 0).pop();
    if (failed) {
      const raw = document.createElement("pre");
      raw.className = "raw";
      raw.textContent = failed.argv.join(" ") + "\n\n" + (failed.output || "(no output)");
      box.appendChild(raw);
    }
  }
}

async function gitAction(path, button, label) {
  const previous = button.textContent;
  button.textContent = label;
  button.disabled = true;
  try {
    renderGitResult(await api(path, { method: "POST" }));
  } catch (error) {
    renderGitResult({ ok: false, message: error.message, steps: [] });
  } finally {
    button.textContent = previous;
    button.disabled = false;
    applyBusy();
    refreshChanges();
  }
}

$("stop").onclick = stopRun;
$("copy-log").onclick = (event) => copyToClipboard(logBox.textContent, event.target);
$("copy-failed").onclick = (event) =>
  copyToClipboard(failingStepOutput() || logBox.textContent, event.target);
// The log already fills its column, so the only thing left to give it is the
// other column's width: this hides the catalogue rather than growing a box.
$("expand-log").onclick = (event) => {
  const focused = $("layout").classList.toggle("focus-log");
  event.target.textContent = focused ? "Two columns" : "Full width";
  logBox.scrollTop = logBox.scrollHeight;
};
$("refresh-changes").onclick = refreshChanges;
$("save").onclick = (event) => gitAction("/api/save-branch", event.target, "Saving…");
$("update").onclick = (event) => gitAction("/api/update", event.target, "Updating…");

(async function start() {
  try {
    const body = await api("/api/catalogue");
    catalogue = body.runs;
    renderCatalogue();
  } catch (error) {
    $("runs").textContent = "Could not load the catalogue: " + error.message;
  }
  await poll();
  await refreshChanges();
  setInterval(poll, 1000);
})();
</script>
</body>
</html>
