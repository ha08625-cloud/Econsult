version: 2
updates:
  # Maintain Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "22:00"
      timezone: "Europe/London"
    ignore:
      - dependency-name: "pydantic"
        update-types: ["version-update:semver-major"]
      - dependency-name: "psycopg2-binary"
        update-types: ["version-update:semver-major"]
      - dependency-name: "nh3"
        update-types: ["version-update:semver-major"]
      - dependency-name: "fastapi"
        update-types: ["version-update:semver-major"]

  # Maintain Frontend dependencies (Node/npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "22:00"
      timezone: "Europe/London"
    ignore:
      - dependency-name: "dompurify"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is the native (Go) compiler rewrite. typescript-eslint
      # declares a peer range of >=4.8.4 <6.1.0 and refuses to load against
      # TS 7.0, so a TS 7 bump fails `npm ci` outright (ERESOLVE) and breaks
      # both CI and the Docker build. Revisit once typescript-eslint ships
      # TS 7 support (typescript-eslint#10940).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Maintain Docker base images (Node 22 slim and Python 3.12 slim)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "22:00"
      timezone: "Europe/London"

  # Maintain CI/CD Pipeline (GitHub Actions runners/steps)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "22:00"
      timezone: "Europe/London"
