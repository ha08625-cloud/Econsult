name: Dependabot auto-merge

# Patch-level Dependabot PRs (e.g. 1.2.3 -> 1.2.4) are approved and queued for
# auto-merge automatically. GitHub only completes the merge once this repo's
# required status checks (the Tests workflow) report green, so patches never
# land without a passing test suite. Minor/major version bumps and any
# non-Dependabot PR are left alone for manual review.
on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Approve and enable auto-merge for patch updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
