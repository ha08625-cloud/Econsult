name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Detects whether anything other than markdown docs changed. Feeds unit/
  # integration below so doc-only PRs skip the actual test run. This job
  # always runs (no path filter on the workflow trigger itself), so unit/
  # integration always report a status even when skipped -- safe for
  # required status checks in branch protection.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!**/*.md'

  # ---------------------------------------------------------------------------
  # Unit tests: Python (no database) + frontend Vitest
  # Mirrors: make test
  # ---------------------------------------------------------------------------
  unit:
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt pytest httpx

      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Run Python unit tests
        run: python -m pytest tests/ -m "not integration" -v

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: TypeScript type check
        run: cd frontend && npx tsc --noEmit

      - name: Run frontend tests
        run: cd frontend && npx vitest run

  # ---------------------------------------------------------------------------
  # Integration tests: Python only, requires Postgres
  # Mirrors: make test-integration
  # ---------------------------------------------------------------------------
  integration:
    name: Integration tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/testdb
      TEST_DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/testdb
      PRACTICE_ID: test-practice
      ALLOWED_ADMIN_DOMAINS: example.com
      ADMIN_URL: "http://localhost/admin"
      DEV_MODE: "1"
      MESH_DELIVERY: "0"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt pytest httpx

      - name: Assert TEST_DATABASE_URL is set
        run: |
          if [ -z "$TEST_DATABASE_URL" ]; then
            echo "ERROR: TEST_DATABASE_URL is not set. Integration tests would silently skip."
            exit 1
          fi
          echo "TEST_DATABASE_URL is set."

      - name: Run Alembic migrations
        run: python -m alembic upgrade head

      - name: Seed test database
        run: |
          PRACTICE_EMAIL=test@example.com \
          PRACTICE_NAME="Test Practice" \
          python scripts/create_admin_user.py test-admin@example.com --create-practice

      - name: Run integration tests
        run: python -m pytest tests/ -m integration -v
