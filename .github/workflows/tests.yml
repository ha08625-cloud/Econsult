name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ---------------------------------------------------------------------------
  # Unit tests: Python (no database) + frontend Vitest
  # Mirrors: make test
  # ---------------------------------------------------------------------------
  unit:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt pytest httpx

      - name: Run Python unit tests
        run: python -m pytest tests/ -m "not integration" -v

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Run frontend tests
        run: cd frontend && npx vitest run

  # ---------------------------------------------------------------------------
  # Integration tests: Python only, requires Postgres
  # Mirrors: make test-integration
  # ---------------------------------------------------------------------------
  integration:
    name: Integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/testdb
      TEST_DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/testdb
      PRACTICE_ID: test-practice
      PRACTICE_NAME: Test Practice
      PRACTICE_EMAIL: test@example.com
      DEV_MODE: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt pytest httpx

      - name: Assert TEST_DATABASE_URL is set
        run: |
          if [ -z "$TEST_DATABASE_URL" ]; then
            echo "ERROR: TEST_DATABASE_URL is not set. Integration tests would silently skip."
            exit 1
          fi
          echo "TEST_DATABASE_URL is set."

      - name: Run Alembic migrations
        run: python -m alembic upgrade head

      - name: Run integration tests
        run: python -m pytest tests/ -m integration -v