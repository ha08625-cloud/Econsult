name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Splits changes into three paths: doc-only (skips everything), rulesets
  # (data/** only -- runs ruleset-validation alone), and code (everything
  # else -- runs unit/integration). A PR touching both code and data/ runs
  # all three jobs. This job always runs (no path filter on the workflow
  # trigger itself), so unit/integration/ruleset-validation always report a
  # status even when skipped -- safe for required status checks in branch
  # protection.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      rulesets: ${{ steps.filter.outputs.rulesets }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!data/**'
            rulesets:
              - 'data/**'

  # ---------------------------------------------------------------------------
  # Ruleset validation: builds the real data/ ruleset tree with no database.
  # Mirrors what main.py does at import time via build_container().
  # ---------------------------------------------------------------------------
  ruleset-validation:
    name: Ruleset validation
    needs: changes
    if: needs.changes.outputs.rulesets == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt pytest

      - name: Validate committed rulesets
        run: python -m pytest tests/test_data_rulesets.py -v

      # The filler-purity guard exists to catch a data/-only edit that
      # introduces symptom language into a filler library, for any of the six
      # signals with libraries. Such a PR skips the unit job entirely, so
      # without this step the guard would never run on the change it was
      # written for. Stdlib-only, so requirements.txt is already enough.
      - name: Validate synthetic fragment libraries
        run: python -m pytest tests/test_synthetic_recombination.py -v

      # Same reasoning for the generated declarative library and the inventory
      # it is built from: both live under data/, so an edit to either skips the
      # unit job and would otherwise never meet the regeneration check.
      - name: Validate the generated declarative library
        run: python -m pytest tests/test_synthetic_declarative.py -v

      # Same reasoning for the realistic held-out set. Its guards are about the
      # committed data/realistic/ files -- that every submission id still lines
      # up with its line in the source file, that no cell is blank, and that the
      # README's distribution table matches the labels -- so an edit to those
      # files is exactly the change they exist to catch, and exactly the change
      # that skips the unit job. Stdlib-only, like the guard above.
      - name: Validate the realistic held-out set
        run: python -m pytest tests/test_encoder_training_holdout.py -v

  # ---------------------------------------------------------------------------
  # Unit tests: Python (no database) + frontend Vitest
  # Mirrors: make test
  # ---------------------------------------------------------------------------
  unit:
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt pytest httpx

      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .

      # The committed declarative library is a build artefact of the phrase
      # inventory, and the two drifting apart would mean the sentences a human
      # read are not the sentences being trained on. Regenerating is cheap and
      # writes nothing in --check mode. Stdlib-only.
      - name: Check the generated declarative library is up to date
        run: python -m scripts.synthetic_data --build-declarative --check

      - name: Run Python unit tests
        run: python -m pytest tests/ -m "not integration" -v

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      # frontend/tsconfig.json is a solution file ("files": [] plus references),
      # so a bare `tsc --noEmit` there resolves zero source files and checks
      # nothing. `tsc -b` builds the referenced projects instead. Both projects
      # already set noEmit, so this type checks without producing output.
      # consultation_outcomes.json lives at app/core/ and is copied into
      # frontend/ at image build time (see Dockerfile); do the same here so the
      # import in src/screens/OutcomeScreen.tsx resolves.
      - name: TypeScript type check
        run: |
          cp app/core/consultation_outcomes.json frontend/
          cd frontend && npx tsc -b

      - name: Run frontend tests
        run: cd frontend && npx vitest run

  # ---------------------------------------------------------------------------
  # Integration tests: Python only, requires Postgres
  # Mirrors: make test-integration
  # ---------------------------------------------------------------------------
  integration:
    name: Integration tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/testdb
      TEST_DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/testdb
      PRACTICE_ID: test-practice
      ALLOWED_ADMIN_DOMAINS: example.com
      ADMIN_URL: "http://localhost/admin"
      DEV_MODE: "1"
      MESH_DELIVERY: "0"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt pytest httpx

      - name: Assert TEST_DATABASE_URL is set
        run: |
          if [ -z "$TEST_DATABASE_URL" ]; then
            echo "ERROR: TEST_DATABASE_URL is not set. Integration tests would silently skip."
            exit 1
          fi
          echo "TEST_DATABASE_URL is set."

      - name: Run Alembic migrations
        run: python -m alembic upgrade head

      - name: Seed test database
        run: |
          PRACTICE_EMAIL=test@example.com \
          PRACTICE_NAME="Test Practice" \
          python scripts/create_admin_user.py test-admin@example.com --create-practice

      - name: Run integration tests
        run: python -m pytest tests/ -m integration -v
