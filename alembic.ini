# Alembic configuration file.
#
# The actual database URL is read from the DATABASE_URL environment variable
# at runtime inside alembic/env.py. This file contains no secrets and is
# safe to commit to version control.

[alembic]
# Path to migration scripts, relative to project root.
script_location = alembic

# Placeholder — overridden at runtime by env.py reading DATABASE_URL.
sqlalchemy.url = placeholder

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
