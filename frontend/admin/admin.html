<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Practice Admin</title>

  <!-- React + Babel via CDN (in-browser transpilation, internal tool only) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

  <style>
    /* ------------------------------------------------------------------ */
    /* Design direction: clinical utilitarian — NHS-adjacent palette,      */
    /* monospaced accents, generous whitespace, zero decoration noise      */
    /* ------------------------------------------------------------------ */

    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap');

    :root {
      --bg:           #f4f6f8;
      --surface:      #ffffff;
      --border:       #d8dee6;
      --border-focus: #1a6fa8;
      --text:         #1a2332;
      --text-muted:   #6b7a8d;
      --accent:       #1a6fa8;
      --accent-hover: #145a8a;
      --danger:       #c0392b;
      --danger-bg:    #fdf2f2;
      --success:      #1a7a4a;
      --success-bg:   #f0faf4;
      --warning-bg:   #fffbf0;
      --warning-text: #7a5c00;
      --btn-radius:   4px;
      --card-radius:  6px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 15px;
      line-height: 1.5;
    }

    /* ---------- Layout ---------- */

    .page-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .page-header .wordmark {
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .page-header .separator {
      width: 1px;
      height: 18px;
      background: var(--border);
    }

    .page-header .title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    .main {
      max-width: 680px;
      margin: 48px auto;
      padding: 0 24px;
    }

    /* ---------- Card ---------- */

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      padding: 32px;
    }

    .card-title {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .card-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 28px;
    }

    /* ---------- Form elements ---------- */

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input[type="text"],
    input[type="password"],
    select {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: var(--btn-radius);
      font-family: inherit;
      font-size: 15px;
      color: var(--text);
      background: var(--surface);
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="text"]:focus,
    input[type="password"]:focus,
    select:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(26,111,168,0.12);
    }

    input.error {
      border-color: var(--danger);
      background: var(--danger-bg);
    }

    input.error:focus {
      box-shadow: 0 0 0 3px rgba(192,57,43,0.12);
    }

    /* ---------- Buttons ---------- */

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: var(--btn-radius);
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.12s, border-color 0.12s, opacity 0.12s;
      white-space: nowrap;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:not(:disabled):hover {
      background: var(--accent-hover);
    }

    .btn-outline {
      background: transparent;
      border-color: var(--border);
      color: var(--text);
    }

    .btn-outline:not(:disabled):hover {
      background: var(--bg);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      padding: 4px 8px;
      font-size: 13px;
    }

    .btn-ghost:not(:disabled):hover {
      color: var(--text);
      background: var(--bg);
    }

    .btn-danger-ghost {
      background: transparent;
      color: var(--danger);
      padding: 4px 8px;
      font-size: 13px;
    }

    .btn-danger-ghost:not(:disabled):hover {
      background: var(--danger-bg);
    }

    /* ---------- Alerts ---------- */

    .alert {
      padding: 10px 14px;
      border-radius: var(--btn-radius);
      font-size: 13px;
      margin-top: 14px;
      border: 1px solid transparent;
    }

    .alert-error {
      background: var(--danger-bg);
      border-color: #e8b4af;
      color: var(--danger);
    }

    .alert-success {
      background: var(--success-bg);
      border-color: #a8d8be;
      color: var(--success);
    }

    .alert-warning {
      background: var(--warning-bg);
      border-color: #e8d48a;
      color: var(--warning-text);
    }

    /* ---------- Token view ---------- */

    .token-view .form-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .token-view .form-row .field {
      flex: 1;
    }

    /* ---------- Editor ---------- */

    .section-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 14px;
      margin-top: 28px;
    }

    .section-label:first-child {
      margin-top: 0;
    }

    .condition-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .condition-row select {
      flex: 1;
    }

    /* ---------- Signposting list ---------- */

    .signposting-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .signposting-item {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .signposting-item input {
      flex: 1;
    }

    .item-controls {
      display: flex;
      gap: 2px;
      flex-shrink: 0;
    }

    .empty-state {
      padding: 20px 0;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      border: 1px dashed var(--border);
      border-radius: var(--btn-radius);
    }

    .list-actions {
      margin-top: 12px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .save-status {
      font-size: 13px;
      margin-left: auto;
    }

    .save-status.success { color: var(--success); }
    .save-status.error   { color: var(--danger); }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 24px 0;
    }

    /* ---------- Loading ---------- */

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      flex-shrink: 0;
    }

    .spinner.dark {
      border-color: rgba(26,111,168,0.2);
      border-top-color: var(--accent);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-row {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 13px;
      padding: 12px 0;
    }

    /* ---------- Mono accents ---------- */
    .mono {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
    }
  </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
  const { useState, useEffect, useCallback, useRef } = React;

  // -------------------------------------------------------------------------
  // API helpers
  // -------------------------------------------------------------------------

  async function apiFetch(path, token, options = {}) {
    const res = await fetch(path, {
      ...options,
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`,
        ...(options.headers || {}),
      },
    });
    return res;
  }

  async function fetchConditions(token) {
    const res = await apiFetch("/admin/conditions", token);
    if (res.status === 401) throw new Error("UNAUTHORIZED");
    if (!res.ok) throw new Error(`Server error: ${res.status}`);
    const data = await res.json();
    return data.conditions;
  }

  async function fetchSignposting(conditionId, token) {
    const res = await apiFetch(`/admin/conditions/${encodeURIComponent(conditionId)}/signposting`, token);
    if (!res.ok) throw new Error(`Server error: ${res.status}`);
    const data = await res.json();
    return data.signposting ?? [];
  }

  async function putSignposting(conditionId, token, items) {
    const res = await apiFetch(
      `/admin/conditions/${encodeURIComponent(conditionId)}/signposting`,
      token,
      {
        method: "PUT",
        body: JSON.stringify({ signposting: items }),
      }
    );
    if (!res.ok) {
      let detail = `Server error: ${res.status}`;
      try {
        const body = await res.json();
        if (body.detail) detail = body.detail;
      } catch (_) {}
      throw new Error(detail);
    }
  }

  // -------------------------------------------------------------------------
  // EditorView
  // -------------------------------------------------------------------------

  function EditorView({ token, conditions }) {
    const [selectedId, setSelectedId] = useState(
      conditions.length > 0 ? conditions[0].id : null
    );
    const [pendingId, setPendingId] = useState(null);

    // We track unsaved changes via a ref so the confirm dialog can read it
    // without needing to lift state out of SignpostingEditor
    const unsavedRef = useRef(false);

    function handleConditionChange(newId) {
      if (newId === selectedId) return;

      // We cannot read SignpostingEditor's internal state directly.
      // Instead, we store the unsaved flag in a ref that SignpostingEditor
      // updates via a callback prop.
      if (unsavedRef.current) {
        const ok = window.confirm(
          "You have unsaved changes. Switch condition and discard them?"
        );
        if (!ok) return;
      }
      setSelectedId(newId);
      unsavedRef.current = false;
    }

    return (
      <div className="card">
        <p className="card-title">Signposting editor</p>
        <p className="card-subtitle">
          Add practice-specific information shown to patients before each condition form.
        </p>

        <div>
          <label htmlFor="condition-select">Condition</label>
          <select
            id="condition-select"
            value={selectedId ?? ""}
            onChange={e => handleConditionChange(e.target.value)}
          >
            {conditions.map(c => (
              <option key={c.id} value={c.id}>{c.label}</option>
            ))}
          </select>
        </div>

        <hr className="divider" />

        <p className="section-label">Signposting items</p>

        {selectedId ? (
          <SignpostingEditorWithRef
            key={selectedId}
            conditionId={selectedId}
            token={token}
            onUnsavedChange={hasChanges => { unsavedRef.current = hasChanges; }}
          />
        ) : (
          <div className="empty-state">Select a condition to begin.</div>
        )}
      </div>
    );
  }

  // Wrapper that exposes unsaved state to the parent via callback
  function SignpostingEditorWithRef({ conditionId, token, onUnsavedChange }) {
    const [items, setItems] = useState([]);
    const [savedItems, setSavedItems] = useState([]);
    const [isLoading, setIsLoading] = useState(true);
    const [loadError, setLoadError] = useState(null);
    const [isSaving, setIsSaving] = useState(false);
    const [saveStatus, setSaveStatus] = useState(null);
    const [validationError, setValidationError] = useState(false);

    useEffect(() => {
      let cancelled = false;
      setIsLoading(true);
      setLoadError(null);
      setSaveStatus(null);
      setValidationError(false);

      fetchSignposting(conditionId, token)
        .then(loaded => {
          if (cancelled) return;
          setItems(loaded);
          setSavedItems(loaded);
          setIsLoading(false);
        })
        .catch(err => {
          if (cancelled) return;
          setLoadError(err.message);
          setIsLoading(false);
        });

      return () => { cancelled = true; };
    }, [conditionId]);

    // Report unsaved state to parent whenever items or savedItems changes
    useEffect(() => {
      const hasChanges = JSON.stringify(items) !== JSON.stringify(savedItems);
      onUnsavedChange(hasChanges);
    }, [items, savedItems]);

    function updateItem(index, value) {
      setItems(prev => prev.map((item, i) => i === index ? value : item));
      setSaveStatus(null);
      setValidationError(false);
    }

    function deleteItem(index) {
      setItems(prev => prev.filter((_, i) => i !== index));
      setSaveStatus(null);
    }

    function moveItem(index, direction) {
      const newItems = [...items];
      const target = index + direction;
      if (target < 0 || target >= newItems.length) return;
      [newItems[index], newItems[target]] = [newItems[target], newItems[index]];
      setItems(newItems);
      setSaveStatus(null);
    }

    function addItem() {
      setItems(prev => [...prev, ""]);
      setSaveStatus(null);
    }

    async function handleSave() {
      const hasEmpty = items.some(item => item.trim() === "");
      if (hasEmpty) {
        setValidationError(true);
        return;
      }

      setIsSaving(true);
      setSaveStatus(null);

      try {
        await putSignposting(conditionId, token, items);
        setSavedItems([...items]);
        setSaveStatus({ type: "success", text: "Saved" });
      } catch (err) {
        const isNetworkError =
          err instanceof TypeError && err.message.toLowerCase().includes("fetch");
        const msg = isNetworkError
          ? "Save failed: could not reach server"
          : `Save failed: ${err.message}`;
        setSaveStatus({ type: "error", text: msg });
      } finally {
        setIsSaving(false);
      }
    }

    if (isLoading) {
      return (
        <div className="loading-row">
          <span className="spinner dark" />
          Loading…
        </div>
      );
    }

    if (loadError) {
      return (
        <div className="alert alert-error">
          Could not load signposting: {loadError}
        </div>
      );
    }

    const hasUnsaved = JSON.stringify(items) !== JSON.stringify(savedItems);

    return (
      <div>
        {items.length === 0 ? (
          <div className="empty-state">
            No signposting configured. Use "Add item" to create the first entry.
          </div>
        ) : (
          <div className="signposting-list">
            {items.map((item, index) => (
              <div className="signposting-item" key={index}>
                <input
                  type="text"
                  value={item}
                  className={validationError && item.trim() === "" ? "error" : ""}
                  onChange={e => updateItem(index, e.target.value)}
                  placeholder="e.g. Self-refer to physio: 0800 123 456"
                />
                <div className="item-controls">
                  <button
                    className="btn btn-ghost"
                    onClick={() => moveItem(index, -1)}
                    disabled={index === 0}
                    title="Move up"
                  >↑</button>
                  <button
                    className="btn btn-ghost"
                    onClick={() => moveItem(index, 1)}
                    disabled={index === items.length - 1}
                    title="Move down"
                  >↓</button>
                  <button
                    className="btn btn-danger-ghost"
                    onClick={() => deleteItem(index)}
                    title="Remove item"
                  >✕</button>
                </div>
              </div>
            ))}
          </div>
        )}

        {validationError && (
          <div className="alert alert-warning" style={{ marginTop: 10 }}>
            Please fill in or remove empty items before saving.
          </div>
        )}

        <div className="list-actions">
          <button className="btn btn-outline" onClick={addItem}>
            + Add item
          </button>
          <button
            className="btn btn-primary"
            onClick={handleSave}
            disabled={isSaving}
          >
            {isSaving ? <><span className="spinner" />Saving…</> : "Save"}
          </button>
          {saveStatus && (
            <span className={`save-status ${saveStatus.type}`}>
              {saveStatus.text}
            </span>
          )}
        </div>

        {hasUnsaved && !saveStatus && (
          <div className="alert alert-warning" style={{ marginTop: 14 }}>
            You have unsaved changes.
          </div>
        )}
      </div>
    );
  }

  // -------------------------------------------------------------------------
  // TokenView
  // -------------------------------------------------------------------------

  function TokenView({ onSuccess }) {
    const [token, setToken] = useState("");
    const [isConnecting, setIsConnecting] = useState(false);
    const [error, setError] = useState(null);

    async function handleConnect() {
      const trimmed = token.trim();
      if (!trimmed) return;

      setIsConnecting(true);
      setError(null);

      try {
        const conditions = await fetchConditions(trimmed);
        onSuccess(trimmed, conditions);
      } catch (err) {
        if (err.message === "UNAUTHORIZED") {
          setError("Invalid token. Check the value and try again.");
        } else {
          setError("Could not reach server. Check that the application is running.");
        }
      } finally {
        setIsConnecting(false);
      }
    }

    function handleKeyDown(e) {
      if (e.key === "Enter") handleConnect();
    }

    return (
      <div className="card token-view">
        <p className="card-title">Connect to admin</p>
        <p className="card-subtitle">
          Enter your admin token to manage practice signposting.
          <br />
          <span style={{ color: "var(--warning-text)", fontSize: 12 }}>
            Note: token-based access is a temporary measure and will be replaced with proper authentication in a future version.
          </span>
        </p>

        <div className="form-row">
          <div className="field">
            <label htmlFor="token-input">Admin token</label>
            <input
              id="token-input"
              type="password"
              value={token}
              onChange={e => setToken(e.target.value)}
              onKeyDown={handleKeyDown}
              placeholder="Enter token"
              autoComplete="off"
            />
          </div>
          <button
            className="btn btn-primary"
            onClick={handleConnect}
            disabled={isConnecting || token.trim() === ""}
            style={{ marginTop: 22 }}
          >
            {isConnecting
              ? <><span className="spinner" />Connecting…</>
              : "Connect"
            }
          </button>
        </div>

        {error && (
          <div className="alert alert-error">{error}</div>
        )}
      </div>
    );
  }

  // -------------------------------------------------------------------------
  // App
  // -------------------------------------------------------------------------

  function App() {
    const [token, setToken] = useState(null);
    const [conditions, setConditions] = useState([]);

    function handleTokenSuccess(validToken, loadedConditions) {
      setToken(validToken);
      setConditions(loadedConditions);
    }

    return (
      <div>
        <header className="page-header">
          <span className="wordmark">econsult</span>
          <span className="separator" />
          <span className="title">Practice admin</span>
        </header>

        <main className="main">
          {token === null ? (
            <TokenView onSuccess={handleTokenSuccess} />
          ) : (
            <EditorView token={token} conditions={conditions} />
          )}
        </main>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
