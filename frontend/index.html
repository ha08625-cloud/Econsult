<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Practice Admin</title>

  <!-- React + Babel via CDN (in-browser transpilation, internal tool only) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

  <!-- Quill 2.0.2 — pinned. If upgrading, re-run Session 0 verification tests. -->
  <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>

  <!-- DOMPurify 3.1.6 — pinned. Must stay in sync with App.tsx and practice_repository.py. -->
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>

  <style>
    /* ------------------------------------------------------------------ */
    /* Design direction: clinical utilitarian — NHS-adjacent palette,      */
    /* monospaced accents, generous whitespace, zero decoration noise      */
    /* ------------------------------------------------------------------ */

    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap');

    :root {
      --bg:           #f4f6f8;
      --surface:      #ffffff;
      --border:       #d8dee6;
      --border-focus: #1a6fa8;
      --text:         #1a2332;
      --text-muted:   #6b7a8d;
      --accent:       #1a6fa8;
      --accent-hover: #145a8a;
      --danger:       #c0392b;
      --danger-bg:    #fdf2f2;
      --success:      #1a7a4a;
      --success-bg:   #f0faf4;
      --warning-bg:   #fffbf0;
      --warning-text: #7a5c00;
      --btn-radius:   4px;
      --card-radius:  6px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 15px;
      line-height: 1.5;
    }

    /* ---------- Layout ---------- */

    .page-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .page-header .wordmark {
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .page-header .separator {
      width: 1px;
      height: 18px;
      background: var(--border);
    }

    .page-header .title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    .main {
      max-width: 680px;
      margin: 48px auto;
      padding: 0 24px;
    }

    /* ---------- Card ---------- */

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      padding: 32px;
    }

    .card-title {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .card-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 28px;
    }

    /* ---------- Form elements ---------- */

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input[type="text"],
    input[type="password"],
    select {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: var(--btn-radius);
      font-family: inherit;
      font-size: 15px;
      color: var(--text);
      background: var(--surface);
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="text"]:focus,
    input[type="password"]:focus,
    select:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(26,111,168,0.12);
    }

    input.error {
      border-color: var(--danger);
      background: var(--danger-bg);
    }

    input.error:focus {
      box-shadow: 0 0 0 3px rgba(192,57,43,0.12);
    }

    /* ---------- Buttons ---------- */

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: var(--btn-radius);
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.12s, border-color 0.12s, opacity 0.12s;
      white-space: nowrap;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:not(:disabled):hover {
      background: var(--accent-hover);
    }

    .btn-outline {
      background: transparent;
      border-color: var(--border);
      color: var(--text);
    }

    .btn-outline:not(:disabled):hover {
      background: var(--bg);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      padding: 4px 8px;
      font-size: 13px;
    }

    .btn-ghost:not(:disabled):hover {
      color: var(--text);
      background: var(--bg);
    }

    /* ---------- Alerts ---------- */

    .alert {
      padding: 10px 14px;
      border-radius: var(--btn-radius);
      font-size: 13px;
      margin-top: 14px;
      border: 1px solid transparent;
    }

    .alert-error {
      background: var(--danger-bg);
      border-color: #e8b4af;
      color: var(--danger);
    }

    .alert-success {
      background: var(--success-bg);
      border-color: #a8d8be;
      color: var(--success);
    }

    .alert-warning {
      background: var(--warning-bg);
      border-color: #e8d48a;
      color: var(--warning-text);
    }

    /* ---------- Token view ---------- */

    .token-view .form-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .token-view .form-row .field {
      flex: 1;
    }

    /* ---------- Editor ---------- */

    .section-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 14px;
      margin-top: 28px;
    }

    .section-label:first-child {
      margin-top: 0;
    }

    .condition-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .condition-row select {
      flex: 1;
    }

    /* ---------- Quill editor overrides ---------- */

    .quill-wrapper {
      border: 1px solid var(--border);
      border-radius: var(--btn-radius);
      overflow: hidden;
      transition: border-color 0.15s;
    }

    .quill-wrapper:focus-within {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(26,111,168,0.12);
    }

    /* Remove Quill's own border — our wrapper provides it */
    .quill-wrapper .ql-toolbar {
      border: none;
      border-bottom: 1px solid var(--border);
      font-family: inherit;
    }

    .quill-wrapper .ql-container {
      border: none;
      font-family: inherit;
      font-size: 15px;
    }

    .quill-wrapper .ql-editor {
      min-height: 140px;
      color: var(--text);
    }

    .quill-wrapper .ql-editor.ql-blank::before {
      color: var(--text-muted);
      font-style: normal;
    }

    /* ---------- Editor actions ---------- */

    .editor-actions {
      margin-top: 12px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .save-status {
      font-size: 13px;
      margin-left: auto;
    }

    .save-status.success { color: var(--success); }
    .save-status.error   { color: var(--danger); }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 24px 0;
    }

    /* ---------- Loading ---------- */

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      flex-shrink: 0;
    }

    .spinner.dark {
      border-color: rgba(26,111,168,0.2);
      border-top-color: var(--accent);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-row {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 13px;
      padding: 12px 0;
    }

    /* ---------- Mono accents ---------- */
    .mono {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
    }

    .empty-state {
      padding: 20px 0;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      border: 1px dashed var(--border);
      border-radius: var(--btn-radius);
    }
  </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
  const { useState, useEffect, useCallback, useRef } = React;

  // -------------------------------------------------------------------------
  // DOMPurify config — defence in depth before transmission to server.
  //
  // NOTE: this config must match the nh3 allowlist in practice_repository.py
  // exactly. If the allowlist changes, update all three locations:
  //   1. practice_repository.py  — nh3.clean() call
  //   2. admin.html              — this constant
  //   3. App.tsx                 — SIGNPOSTING_PURIFY_CONFIG constant
  //
  // rel is included here because nh3 automatically injects
  // rel="noopener noreferrer" into stored HTML. DOMPurify must not strip
  // it on render. nh3 does not accept rel in its attributes dict (it panics)
  // — it injects rel itself via the link_rel default.
  // -------------------------------------------------------------------------
  const SIGNPOSTING_PURIFY_CONFIG = {
    ALLOWED_TAGS: ['p', 'strong', 'em', 'a', 'ul', 'ol', 'li', 'br'],
    ALLOWED_ATTR: ['href', 'rel', 'target'],
    ALLOWED_URI_REGEXP: /^https?:/i
  };

  // -------------------------------------------------------------------------
  // API helpers
  // -------------------------------------------------------------------------

  async function apiFetch(path, token, options = {}) {
    const res = await fetch(path, {
      ...options,
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`,
        ...(options.headers || {}),
      },
    });
    return res;
  }

  async function fetchConditions(token) {
    const res = await apiFetch("/admin/conditions", token);
    if (res.status === 401) throw new Error("UNAUTHORIZED");
    if (!res.ok) throw new Error(`Server error: ${res.status}`);
    const data = await res.json();
    return data.conditions;
  }

  // Returns the signposting HTML string, or null if none is configured.
  async function fetchSignposting(conditionId, token) {
    const res = await apiFetch(
      `/admin/conditions/${encodeURIComponent(conditionId)}/signposting`,
      token
    );
    if (!res.ok) throw new Error(`Server error: ${res.status}`);
    const data = await res.json();
    return data.signposting ?? null;
  }

  // Sends the signposting HTML string to the PUT endpoint.
  // Empty content is handled server-side: the repository deletes the row
  // and returns {"signposting": null}. The router never receives a 400 for
  // empty content.
  async function putSignposting(conditionId, token, htmlString) {
    const res = await apiFetch(
      `/admin/conditions/${encodeURIComponent(conditionId)}/signposting`,
      token,
      {
        method: "PUT",
        body: JSON.stringify({ signposting: htmlString }),
      }
    );
    if (!res.ok) {
      let detail = `Server error: ${res.status}`;
      try {
        const body = await res.json();
        if (body.detail) detail = body.detail;
      } catch (_) {}
      throw new Error(detail);
    }
    const data = await res.json();
    // Return the sanitised HTML from the server so the caller can update
    // the baseline to what was actually stored, not what was sent.
    return data.signposting ?? null;
  }

  // -------------------------------------------------------------------------
  // SignpostingEditor
  //
  // Quill is an imperative, DOM-mutating library. It cannot be managed via
  // React state. The pattern here is:
  //   - A ref holds the DOM node that Quill mounts into (editorDivRef)
  //   - A ref holds the Quill instance itself (quillRef)
  //   - Quill is instantiated once in useEffect on mount
  //   - Content loading and event listeners are set up in a separate
  //     useEffect that runs after Quill is ready
  //
  // IMPORTANT: key={selectedId} on this component in EditorView forces a
  // full React remount every time the condition changes. This means Quill is
  // destroyed and recreated from scratch on every switch. This is intentional
  // — it avoids complex re-initialisation logic and keeps the component
  // simple. Do not remove key={selectedId} to optimise performance without
  // first understanding this dependency.
  // -------------------------------------------------------------------------

  function SignpostingEditor({ conditionId, token, onUnsavedChange }) {
    const editorDivRef = useRef(null);
    const quillRef = useRef(null);

    const [isLoading, setIsLoading] = useState(true);
    const [loadError, setLoadError] = useState(null);
    const [isSaving, setIsSaving] = useState(false);
    const [saveStatus, setSaveStatus] = useState(null); // {type, text} | null
    const [hasUnsaved, setHasUnsaved] = useState(false);

    // Step 1: instantiate Quill once after the component mounts.
    // We do not load content here — that happens in the next effect once
    // quillRef.current is populated.
    useEffect(() => {
      if (!editorDivRef.current) return;

      const quill = new Quill(editorDivRef.current, {
        theme: 'snow',
        placeholder: 'Add information for patients here…',
        modules: {
          toolbar: [['bold', 'italic', 'link'], [{ list: 'bullet' }]],
          // Disable the default keyboard module's tab behaviour so tab
          // moves focus out of the editor rather than inserting content.
          keyboard: {
            bindings: {
              tab: false,
            }
          }
        }
      });

      quillRef.current = quill;

      // Cleanup: destroy Quill when this component unmounts.
      // React will remount this component on condition switch (key={selectedId}),
      // so this runs on every condition change.
      return () => {
        quillRef.current = null;
      };
    }, []); // empty deps — runs once on mount

    // Step 2: once Quill exists, load content and set up change detection.
    useEffect(() => {
      if (!quillRef.current) return;

      const quill = quillRef.current;
      let cancelled = false;

      async function loadContent() {
        setIsLoading(true);
        setLoadError(null);

        try {
          const savedHtml = await fetchSignposting(conditionId, token);

          if (cancelled) return;

          if (savedHtml) {
            // dangerouslyPasteHTML is synchronous. The listener is attached
            // after this call so the paste-triggered text-change event does
            // not incorrectly mark the content as unsaved.
            quill.clipboard.dangerouslyPasteHTML(savedHtml);
          }

          // Capture the baseline text content after initialisation.
          // We compare text, not raw HTML, to avoid false positives from
          // Quill normalising the HTML during the paste above.
          const baseline = quill.getText();

          // Attach the change listener only after baseline is captured.
          quill.on('text-change', () => {
            const currentText = quill.getText();
            const changed = currentText !== baseline;
            setHasUnsaved(changed);
            onUnsavedChange(changed);
          });

        } catch (err) {
          if (!cancelled) setLoadError(err.message);
        } finally {
          if (!cancelled) setIsLoading(false);
        }
      }

      loadContent();

      return () => { cancelled = true; };
    }, [conditionId, token]); // re-runs if condition or token changes, but
                               // key={selectedId} means this component remounts
                               // on condition change anyway — deps are here for
                               // correctness

    async function handleSave() {
      const quill = quillRef.current;
      if (!quill) return;

      setIsSaving(true);
      setSaveStatus(null);

      try {
        // Get the editor content as semantic HTML.
        const rawHtml = quill.getSemanticHTML();

        // Run through DOMPurify as a defence-in-depth step before
        // transmission. The server (nh3) is the authoritative sanitiser.
        const sanitisedHtml = DOMPurify.sanitize(rawHtml, SIGNPOSTING_PURIFY_CONFIG);

        // Send unconditionally — the server handles empty content by
        // deleting the row and returning {"signposting": null}.
        const savedHtml = await putSignposting(conditionId, token, sanitisedHtml);

        // Update baseline to what the server actually stored (post-sanitisation),
        // not what we sent. This avoids a false unsaved-change warning if the
        // server's nh3 pass modifies the content slightly.
        const newBaseline = savedHtml || "";

        // Re-sync the editor to the saved content so the baseline and
        // editor content are in agreement.
        if (savedHtml) {
          // Temporarily remove the text-change listener to avoid a false
          // unsaved-change trigger during the re-sync paste.
          quill.off('text-change');
          quill.clipboard.dangerouslyPasteHTML(savedHtml);

          const resyncedBaseline = quill.getText();
          quill.on('text-change', () => {
            const changed = quill.getText() !== resyncedBaseline;
            setHasUnsaved(changed);
            onUnsavedChange(changed);
          });
        } else {
          // Content was cleared server-side. Reset the editor.
          quill.off('text-change');
          quill.setText('');

          const emptyBaseline = quill.getText();
          quill.on('text-change', () => {
            const changed = quill.getText() !== emptyBaseline;
            setHasUnsaved(changed);
            onUnsavedChange(changed);
          });
        }

        setHasUnsaved(false);
        onUnsavedChange(false);
        setSaveStatus({ type: "success", text: "Saved" });

      } catch (err) {
        const isNetworkError =
          err instanceof TypeError && err.message.toLowerCase().includes("fetch");
        const msg = isNetworkError
          ? "Save failed: could not reach server"
          : `Save failed: ${err.message}`;
        setSaveStatus({ type: "error", text: msg });
        // Do not clear editor content on failure.
      } finally {
        setIsSaving(false);
      }
    }

    if (loadError) {
      return (
        <div className="alert alert-error">
          Could not load signposting: {loadError}
        </div>
      );
    }

    return (
      <div>
        {isLoading && (
          <div className="loading-row">
            <span className="spinner dark" />
            Loading…
          </div>
        )}

        <div style={{ display: isLoading ? 'none' : 'block' }}>
          <div className="quill-wrapper">
            <div ref={editorDivRef} />
          </div>

          <div className="editor-actions">
            <button
              className="btn btn-primary"
              onClick={handleSave}
              disabled={isSaving}
            >
              {isSaving ? <><span className="spinner" />Saving…</> : "Save"}
            </button>
            {saveStatus && (
              <span className={`save-status ${saveStatus.type}`}>
                {saveStatus.text}
              </span>
            )}
          </div>

          {hasUnsaved && !saveStatus && (
            <div className="alert alert-warning" style={{ marginTop: 14 }}>
              You have unsaved changes.
            </div>
          )}
        </div>
      </div>
    );
  }

  // -------------------------------------------------------------------------
  // EditorView
  // -------------------------------------------------------------------------

  function EditorView({ token, conditions }) {
    const [selectedId, setSelectedId] = useState(
      conditions.length > 0 ? conditions[0].id : null
    );

    // Track unsaved state via a ref so the confirm dialog can read it
    // without needing to lift state out of SignpostingEditor.
    const unsavedRef = useRef(false);

    function handleConditionChange(newId) {
      if (newId === selectedId) return;

      if (unsavedRef.current) {
        const ok = window.confirm(
          "You have unsaved changes. Switch condition and discard them?"
        );
        if (!ok) return;
      }
      setSelectedId(newId);
      unsavedRef.current = false;
    }

    return (
      <div className="card">
        <p className="card-title">Signposting editor</p>
        <p className="card-subtitle">
          Add practice-specific information shown to patients before each condition form.
        </p>

        <div>
          <label htmlFor="condition-select">Condition</label>
          <select
            id="condition-select"
            value={selectedId ?? ""}
            onChange={e => handleConditionChange(e.target.value)}
          >
            {conditions.map(c => (
              <option key={c.id} value={c.id}>{c.label}</option>
            ))}
          </select>
        </div>

        <hr className="divider" />

        <p className="section-label">Signposting content</p>

        {selectedId ? (
          // key={selectedId} forces a full remount of SignpostingEditor on
          // every condition change. This is intentional — it destroys and
          // recreates the Quill instance cleanly rather than requiring
          // complex re-initialisation logic. Do not remove this key.
          <SignpostingEditor
            key={selectedId}
            conditionId={selectedId}
            token={token}
            onUnsavedChange={hasChanges => { unsavedRef.current = hasChanges; }}
          />
        ) : (
          <div className="empty-state">Select a condition to begin.</div>
        )}
      </div>
    );
  }

  // -------------------------------------------------------------------------
  // TokenView
  // -------------------------------------------------------------------------

  function TokenView({ onSuccess }) {
    const [token, setToken] = useState("");
    const [isConnecting, setIsConnecting] = useState(false);
    const [error, setError] = useState(null);

    async function handleConnect() {
      const trimmed = token.trim();
      if (!trimmed) return;

      setIsConnecting(true);
      setError(null);

      try {
        const conditions = await fetchConditions(trimmed);
        onSuccess(trimmed, conditions);
      } catch (err) {
        if (err.message === "UNAUTHORIZED") {
          setError("Invalid token. Check the value and try again.");
        } else {
          setError("Could not reach server. Check that the application is running.");
        }
      } finally {
        setIsConnecting(false);
      }
    }

    function handleKeyDown(e) {
      if (e.key === "Enter") handleConnect();
    }

    return (
      <div className="card token-view">
        <p className="card-title">Connect to admin</p>
        <p className="card-subtitle">
          Enter your admin token to manage practice signposting.
          <br />
          <span style={{ color: "var(--warning-text)", fontSize: 12 }}>
            Note: token-based access is a temporary measure and will be replaced with proper authentication in a future version.
          </span>
        </p>

        <div className="form-row">
          <div className="field">
            <label htmlFor="token-input">Admin token</label>
            <input
              id="token-input"
              type="password"
              value={token}
              onChange={e => setToken(e.target.value)}
              onKeyDown={handleKeyDown}
              placeholder="Enter token"
              autoComplete="off"
            />
          </div>
          <button
            className="btn btn-primary"
            onClick={handleConnect}
            disabled={isConnecting || token.trim() === ""}
            style={{ marginTop: 22 }}
          >
            {isConnecting
              ? <><span className="spinner" />Connecting…</>
              : "Connect"
            }
          </button>
        </div>

        {error && (
          <div className="alert alert-error">{error}</div>
        )}
      </div>
    );
  }

  // -------------------------------------------------------------------------
  // App
  // -------------------------------------------------------------------------

  function App() {
    const [token, setToken] = useState(null);
    const [conditions, setConditions] = useState([]);

    function handleTokenSuccess(validToken, loadedConditions) {
      setToken(validToken);
      setConditions(loadedConditions);
    }

    return (
      <div>
        <header className="page-header">
          <span className="wordmark">econsult</span>
          <span className="separator" />
          <span className="title">Practice admin</span>
        </header>

        <main className="main">
          {token === null ? (
            <TokenView onSuccess={handleTokenSuccess} />
          ) : (
            <EditorView token={token} conditions={conditions} />
          )}
        </main>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
