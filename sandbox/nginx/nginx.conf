# MESH sandbox mTLS-terminating proxy.
#
# Sits in front of the NHSDigital mesh-sandbox container, which does not
# enforce mTLS natively (see docs/nhs_integration_reference.md). This proxy
# validates the worker's client certificate against the dev CA in
# sandbox/certs/sandbox_ca.pem and proxies the request to the sandbox on
# the internal docker network.
#
# This file is mounted at /etc/nginx/conf.d/default.conf inside the nginx
# container, replacing the image default. The outer nginx.conf provided by
# the official nginx image is unchanged.
#
# See docs/arch_security.md section 8 for the strategy and parity limits.

upstream mesh_sandbox {
    # Resolved by docker's internal DNS at nginx startup. Service name from
    # docker-compose.yml. Port 443 is the sandbox's HTTPS listener.
    server mesh_sandbox:443;
}

server {
    listen 443 ssl;
    server_name localhost;

    # ----- Server identity (presented to the worker) -----
    ssl_certificate     /etc/nginx/certs/sandbox_server.pem;
    ssl_certificate_key /etc/nginx/certs/sandbox_server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # ----- Client identity validation (mTLS) -----
    # The worker MUST present a certificate signed by this CA. Connections
    # without a client cert fail at TLS handshake.
    ssl_client_certificate /etc/nginx/certs/sandbox_ca.pem;
    ssl_verify_client      on;
    ssl_verify_depth       2;

    # MESH messages can be large (NHS docs cite a 100 MB compressed limit).
    # 200 MB gives headroom above that.
    client_max_body_size  200M;

    # Generous timeouts to avoid spurious 504s while debugging.
    proxy_read_timeout    120s;
    proxy_send_timeout    120s;
    client_body_timeout   120s;

    location / {
        proxy_pass              https://mesh_sandbox;
        # The sandbox's self-signed cert rotates on every container restart.
        # Verifying it would be pointless; the hop is internal to the docker
        # bridge network and never leaves the host.
        proxy_ssl_verify        off;
        proxy_set_header        Host $host;
        proxy_set_header        X-Forwarded-For $remote_addr;
        proxy_set_header        X-Forwarded-Proto https;
    }
}