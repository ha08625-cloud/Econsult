# MESH Sandbox for local development.
#
# A locally-run mock of the NHS MESH API for testing mesh_worker.py
# (dispatcher) and mesh_tracking_worker.py (status poller) without needing
# real Spine credentials.
#
# This file is consumed only by local docker compose — it is NOT deployed
# to Railway or used in CI.
#
# Topology:
#                                          internal docker network (mesh_net)
#                                          ┌──────────────────────────────────┐
#   host:8700 ─── HTTPS+mTLS ───► nginx:443│                                  │
#                                          │   nginx ──► mesh_sandbox:443     │
#                                          │   (TLS terminated, client cert   │
#                                          │    validated vs sandbox_ca.pem)  │
#                                          └──────────────────────────────────┘
#
# The nginx layer enforces mTLS. The mesh-sandbox container itself does not
# support mTLS natively (see docs/nhs_integration_reference.md). The
# internal hop is HTTPS-without-verify because the sandbox's self-signed
# cert rotates on every restart and the hop never leaves the docker network.
#
# Usage:
#   make sandbox-up        # start in background
#   make sandbox-check     # confirm mTLS handshake + healthcheck succeed
#   make sandbox-down      # stop and remove
#
# Direct curl (must use the dev client cert; plain curl will fail):
#   curl --cacert certs/sandbox_ca.pem \
#        --cert   certs/sandbox_client.pem \
#        --key    certs/sandbox_client.key \
#        https://localhost:8700/health
#
# Pinned tag (mesh-sandbox): v1.0.54 (released 27 March 2026 — latest at time
# of build). Bump deliberately, not casually — sandbox behaviour can shift
# between releases.

services:
  mesh_sandbox:
    build:
      context: https://github.com/NHSDigital/mesh-sandbox.git#refs/tags/v1.0.54
    # No host port mapping. The sandbox is reachable only via the internal
    # mesh_net network, by service name `mesh_sandbox`, on container port 443.
    networks:
      - mesh_net
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 3
    healthcheck:
      # Runs inside the mesh_sandbox container, hitting its own HTTPS
      # listener on localhost. -k because the sandbox's self-signed cert
      # is not trusted by curl by default.
      test: curl -ksf https://localhost/health || exit 1
      interval: 3s
      timeout: 10s
    environment:
      # Shared secret used by the sandbox to validate the Authorization header.
      # Workers must pass the same value via MESH_SHARED_KEY.
      - SHARED_KEY=TestKey
      # Sandbox listens on HTTPS. nginx terminates TLS on its own listener
      # and connects to this with proxy_ssl_verify off — see nginx/nginx.conf.
      - SSL=yes
      # The image defaults to STORE_MODE=file at /tmp/mesh_store. docker
      # compose down wipes the container which wipes the store — a clean
      # slate per dev session.
    volumes:
      # Pre-create our two test mailboxes (SENDER_MAILBOX, TARGET_MAILBOX).
      # Path matches the official NHSDigital/mesh-sandbox docker-compose.yml.
      - ./mailboxes.jsonl:/app/mesh_sandbox/store/data/mailboxes.jsonl:ro

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      mesh_sandbox:
        condition: service_healthy
    ports:
      # The worker connects here. nginx is the host-facing entry point.
      - "8700:443"
    networks:
      - mesh_net
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/sandbox_server.pem:/etc/nginx/certs/sandbox_server.pem:ro
      - ./certs/sandbox_server.key:/etc/nginx/certs/sandbox_server.key:ro
      - ./certs/sandbox_ca.pem:/etc/nginx/certs/sandbox_ca.pem:ro
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 3

networks:
  mesh_net:
    driver: bridge