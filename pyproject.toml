[tool.ruff]
target-version = "py312"
line-length = 100

# Migration scripts are semi-autogenerated by Alembic and reformatting them
# on every revision creates noise with no real benefit.
# *.md excluded because ruff (0.16+) formats fenced ```python blocks in
# Markdown by default, but our docs' snippets are illustrative fragments
# (deliberately indented for context, aligned comments, partial statements
# like a bare kwarg line) rather than standalone valid modules -- running
# the Python formatter on them silently changes their meaning.
# Uses extend-exclude (not exclude) so ruff's built-in defaults
# (.venv, node_modules, .git, etc.) stay in effect rather than being
# overwritten by this list.
extend-exclude = ["alembic/", "*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (unused imports/variables, undefined names, etc.)
    "I",    # isort (import sorting/grouping)
    "UP",   # pyupgrade (flags outdated syntax for the target Python version)
    "B",    # flake8-bugbear (common bug-prone patterns, e.g. mutable default args)
    "SIM",  # flake8-simplify (unnecessarily convoluted code)
]

# Deliberately not enabling: docstring rules (D), and the very opinionated
# "everything must have a type hint" rules (ANN). Those are much larger
# adoption efforts and better decided on separately, not bundled into the
# initial rollout.
ignore = [
    "B008",  # FastAPI's Depends()/Query()/etc. are meant to be called in
             # function defaults - that's the framework's DI pattern, not a
             # bug. This also silences genuine mutable-default-arg bugs
             # outside routers, which is a real tradeoff worth knowing about.
]

[tool.ruff.lint.per-file-ignores]
# Test files commonly use assert and star-imports of fixtures; relax a couple
# of rules there rather than fighting the test-writing style.
"tests/**/*.py" = ["B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"